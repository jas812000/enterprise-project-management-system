# Integration tests use isolated PostgreSQL Testcontainers databases.
# Flyway initializes the test schema before Hibernate validation.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

# Hibernate validates the schema created by Flyway.
spring.jpa.hibernate.ddl-auto=validate

# Disable Open-in-View to match the production application configuration.
spring.jpa.open-in-view=false

epms.security.rate-limit.hmac-key=test-only-rate-limit-hmac-secret-32-characters
